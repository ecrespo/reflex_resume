name: Static Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: static-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ecrespo/reflex_resume'
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Deploy key is a bypass actor in the "Protect main" ruleset, so the
          # auto-commit of public/ can push to main. Empty on PRs from forks.
          ssh-key: ${{ secrets.STATIC_BUILD_DEPLOY_KEY }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Reflex runs the Vite build with the Node.js on PATH; pin it to Node 24.
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Run build script
        run: bash remote_build.sh
        env:
          # GA4 measurement id (Settings > Secrets and variables > Actions >
          # Variables). Empty leaves Google Analytics disabled in the export.
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}

      # On pull requests only validate that the export works; publish only on push to main.
      - name: Add public folder to git
        if: github.event_name == 'push'
        run: git add -f public/

      - name: Commit and Push changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: Update static build [skip ci]
          # reflex init also rewrites files like AGENTS.md/CLAUDE.md; only publish the export.
          file_pattern: public/
          # public/ is in .gitignore (local builds); force-add the export here.
          add_options: -f
          commit_user_name: Ernesto Crespo [Github Actions]
          commit_user_email: ecrespo@gmail.com
          commit_author: Ernesto Crespo <ecrespo@gmail.com>