name: Static Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: static-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ecrespo/reflex_resume'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run build script
        run: bash remote_build.sh

      - name: Add public folder to git
        run: git add -f public/

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update static build [skip ci]
          commit_user_name: Ernesto Crespo [Github Actions]
          commit_user_email: ecrespo@gmail.com
          commit_author: Ernesto Crespo <ecrespo@gmail.com>