[project]
name = "reflex-resume"
version = "0.1.0"
description = "Ernesto Crespo's web site"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "reflex>=0.9.11",
    "flexdown>=0.3.0",
    "reflex-knightlab-timeline>=0.1.2",
    "reflex-rosencharts>=0.2.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".web", "public", "node_modules", "content", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = [".venv", ".web", "public", "node_modules"]
